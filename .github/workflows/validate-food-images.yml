name: Validate community food images

on:
  pull_request:
    paths:
      - "packages/food-images/contributions/**"
      - "scripts/build-food-images.ts"
      - "src/lib/images/process-image.ts"
      - "packages/food-images/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-food-images.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:food-images
      - run: npm run lint
